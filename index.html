<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      /* يمكنك التحكم بالألوان من هنا */
      --pink-bg: #fca5a5;       /* لون الصف العلوي والعمود الجانبي */
      --dark-red-bg: #7f1d1d;   /* لون الخلايا المائلة */
      --border-color: #000000;  /* لون الحدود والخط */
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: transparent;
      margin: 0;
    }

    .matrix-wrapper {
      position: relative;
      display: inline-block;
    }

    .matrix-table {
      border-collapse: collapse;
      border: 2.5px solid var(--border-color);
      background-color: #ffffff;
    }

    .matrix-table td, .matrix-table th {
      width: 65px;
      height: 50px;
      border: 2px solid var(--border-color);
      padding: 0;
      box-sizing: border-box;
    }

    .pink-bg {
      background-color: var(--pink-bg);
    }

    .dark-red-bg {
      background-color: var(--dark-red-bg);
    }

    /* الخط المائل الممتد من أسفل اليسار إلى أعلى اليمين */
    .diagonal-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .diagonal-line line {
      stroke: var(--border-color);
      stroke-width: 3;
    }
  </style>
</head>
<body>

  <div class="matrix-wrapper">
    <table class="matrix-table">
      <!-- الصف العلوي -->
      <tr>
        <th class="pink-bg"></th>
        <th class="pink-bg"></th>
        <th class="pink-bg"></th>
        <th class="pink-bg"></th>
        <th class="pink-bg"></th>
        <th class="pink-bg"></th>
        <th></th>
      </tr>

      <!-- الصف 1 -->
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="dark-red-bg"></td>
        <td class="pink-bg"></td>
      </tr>

      <!-- الصف 2 -->
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="dark-red-bg"></td>
        <td></td>
        <td class="pink-bg"></td>
      </tr>

      <!-- الصف 3 -->
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td class="dark-red-bg"></td>
        <td></td>
        <td></td>
        <td class="pink-bg"></td>
      </tr>

      <!-- الصف 4 -->
      <tr>
        <td></td>
        <td></td>
        <td class="dark-red-bg"></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="pink-bg"></td>
      </tr>

      <!-- الصف 5 -->
      <tr>
        <td></td>
        <td class="dark-red-bg"></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="pink-bg"></td>
      </tr>

      <!-- الصف 6 -->
      <tr>
        <td class="dark-red-bg"></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="pink-bg"></td>
      </tr>
    </table>

    <!-- رسم الخط القطري المائل فوق الجدول -->
    <svg class="diagonal-line">
      <line x1="0" y1="100%" x2="100%" y2="0" />
    </svg>
  </div>

</body>
</html>
