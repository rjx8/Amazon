<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محرر الأشكال الهندسية التفاعلي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      max-width: 1100px;
      width: 100%;
      justify-content: center;
      align-items: flex-start;
    }

    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      flex: 1;
      min-width: 320px;
    }

    .canvas-wrapper {
      width: 100%;
      max-width: 380px;
      height: 380px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: 
        linear-gradient(45deg, #26334d 25%, transparent 25%), 
        linear-gradient(-45deg, #26334d 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #26334d 75%), 
        linear-gradient(-45deg, transparent 75%, #26334d 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border: 2px dashed var(--border-color);
      margin-bottom: 1.5rem;
      padding: 1rem;
    }

    svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.2));
    }

    .shape-part {
      cursor: pointer;
      transition: opacity 0.2s ease, stroke 0.2s ease;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 2px;
    }

    .shape-part:hover {
      opacity: 0.85;
      stroke: #ffffff;
      stroke-width: 3px;
    }

    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      flex: 1;
      min-width: 300px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .controls-card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
      color: var(--accent-color);
    }

    .color-picker-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 340px;
      overflow-y: auto;
      padding-left: 0.5rem;
    }

    .color-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .color-item label {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .color-inputs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      width: 90px;
      text-align: center;
      font-family: monospace;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    input[type="text"]:focus {
      outline: 1px solid var(--accent-color);
    }

    .action-btns {
      display: flex;
      gap: 1rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: #0284c7;
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
    }

    .btn-secondary:hover {
      background-color: rgba(56, 189, 248, 0.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header>
    <h1>محرر ومصمم الأشكال الهندسية</h1>
    <p>انقر على أجزاء الشكل لتغيير ألوانها، أو استخدم التاقات (Hex Codes)، ثم قم بتحميل الشكل بخلفية شفافة.</p>
  </header>

  <div class="container">
    <div class="preview-card">
      <div class="canvas-wrapper">
        <svg id="geometric-shape" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <polygon class="shape-part" id="part-1" data-name="الجزء العلوي" points="150,20 220,100 80,100" fill="#38bdf8" />
          <polygon class="shape-part" id="part-2" data-name="الجناح الأيسر" points="80,100 20,170 80,240 120,170" fill="#818cf8" />
          <polygon class="shape-part" id="part-3" data-name="الجناح الأيمن" points="220,100 280,170 220,240 180,170" fill="#c084fc" />
          <polygon class="shape-part" id="part-4" data-name="المعين المركزي" points="150,110 180,170 150,230 120,170" fill="#f472b6" />
          <polygon class="shape-part" id="part-5" data-name="القاعدة السفلية" points="120,240 150,280 180,240 150,230" fill="#fb7185" />
        </svg>
      </div>

      <div class="action-btns">
        <button class="btn btn-primary" id="download-png">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
          حفظ PNG (شفاف)
        </button>
        <button class="btn btn-secondary" id="download-svg">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .58l2.59-2.59L17 11.41l-5 5-5-5 1.41-1.41L11 12.58V3h2v9.58z"/></svg>
          حفظ SVG
        </button>
      </div>
    </div>

    <div class="controls-card">
      <h2>التحكم بالألوان (Hex Tags)</h2>
      <div class="color-picker-group" id="controls-container"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('controls-container');
      const svgElement = document.getElementById('geometric-shape');

      function initControls() {
        container.innerHTML = '';
        const shapeParts = svgElement.querySelectorAll('.shape-part');

        shapeParts.forEach((part, index) => {
          const partId = part.id || `part-${index + 1}`;
          part.id = partId;
          const partName = part.getAttribute('data-name') || `الجزء ${index + 1}`;
          const initialColor = part.getAttribute('fill') || '#38bdf8';

          const itemDiv = document.createElement('div');
          itemDiv.className = 'color-item';
          itemDiv.innerHTML = `
            <label for="picker-${partId}">${partName}</label>
            <div class="color-inputs">
              <input type="text" id="hex-${partId}" value="${initialColor}" maxlength="7">
              <input type="color" id="picker-${partId}" value="${initialColor}">
            </div>
          `;
          container.appendChild(itemDiv);

          const colorPicker = itemDiv.querySelector(`#picker-${partId}`);
          const hexInput = itemDiv.querySelector(`#hex-${partId}`);

          colorPicker.addEventListener('input', (e) => {
            const newColor = e.target.value;
            part.setAttribute('fill', newColor);
            hexInput.value = newColor.toUpperCase();
          });

          hexInput.addEventListener('input', (e) => {
            let val = e.target.value;
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-F]{6}$/i.test(val)) {
              part.setAttribute('fill', val);
              colorPicker.value = val;
            }
          });

          part.addEventListener('click', () => colorPicker.click());
        });
      }

      initControls();

      // حفظ PNG شفافة
      document.getElementById('download-png').addEventListener('click', () => {
        const svgData = new XMLSerializer().serializeToString(svgElement);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const blobURL = (window.URL || window.webkitURL).createObjectURL(svgBlob);

        const image = new Image();
        image.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = 3;
          canvas.width = 300 * scale;
          canvas.height = 300 * scale;
          
          const context = canvas.getContext('2d');
          context.scale(scale, scale);
          context.drawImage(image, 0, 0, 300, 300);

          const downloadLink = document.createElement('a');
          downloadLink.href = canvas.toDataURL('image/png');
          downloadLink.download = 'shape-transparent.png';
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
        };
        image.src = blobURL;
      });

      // حفظ SVG
      document.getElementById('download-svg').addEventListener('click', () => {
        const svgData = new XMLSerializer().serializeToString(svgElement);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const downloadLink = document.createElement('a');
        downloadLink.href = URL.createObjectURL(svgBlob);
        downloadLink.download = 'shape.svg';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      });
    });
  </script>
</body>
</html>
