<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BlockCraft</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

/* Crosshair */

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:10;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:#fff;
    box-shadow:0 0 3px #000;
}

#crosshair::before{
    width:2px;
    height:22px;
    left:10px;
}

#crosshair::after{
    width:22px;
    height:2px;
    left:0;
    top:10px;
}


/* HUD */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
}

#stats{
    position:absolute;
    top:12px;
    left:14px;

    color:white;

    font-size:15px;

    line-height:1.7;

    text-shadow:
        2px 2px 3px #000;
}

#help{
    position:absolute;
    top:12px;
    right:14px;

    color:white;

    text-align:right;

    font-size:13px;

    line-height:1.6;

    text-shadow:
        2px 2px 3px #000;
}


/* Hotbar */

#hotbar{
    position:absolute;

    bottom:18px;

    left:50%;

    transform:
        translateX(-50%);

    display:flex;

    gap:4px;

    pointer-events:auto;
}

.slot{
    width:55px;
    height:55px;

    background:#555c;

    border:3px solid #222;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    font-size:26px;

    cursor:pointer;

    user-select:none;
}

.slot.selected{
    border-color:white;

    box-shadow:
        0 0 0 2px #333;
}

.slot-number{
    position:absolute;

    right:3px;
    bottom:1px;

    color:white;

    font-size:10px;

    text-shadow:
        1px 1px 2px #000;
}


/* Start */

#startScreen{
    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        linear-gradient(#0007,#000b),
        linear-gradient(
            135deg,
            #4b8b38,
            #22608a
        );
}

.startBox{
    width:min(420px,90%);

    padding:30px;

    text-align:center;

    color:white;

    background:#111d;

    border:3px solid #777;

    box-shadow:
        0 10px 40px #0009;
}

.startBox h1{
    margin-top:0;

    font-size:42px;
}

.startBox p{
    line-height:1.7;
}

#playButton{
    border:3px solid #344d20;

    background:#5e9438;

    color:white;

    padding:13px 35px;

    font-size:20px;

    cursor:pointer;
}


/* Mobile */

#mobileControls{
    display:none;

    position:fixed;

    inset:0;

    z-index:20;

    pointer-events:none;
}

.mobileButton{
    position:absolute;

    width:52px;
    height:52px;

    border-radius:12px;

    background:#2229;

    border:2px solid #fff8;

    color:white;

    font-size:22px;

    display:flex;

    align-items:center;
    justify-content:center;

    pointer-events:auto;

    user-select:none;
}

#movement{
    position:absolute;

    bottom:100px;
    left:20px;

    width:160px;
    height:160px;
}

#up{
    left:54px;
    top:0;
}

#down{
    left:54px;
    bottom:0;
}

#left{
    left:0;
    top:54px;
}

#right{
    right:0;
    top:54px;
}

#mobileActions{
    position:absolute;

    right:18px;
    bottom:105px;

    display:flex;

    gap:9px;

    pointer-events:auto;
}

.action{
    width:60px;
    height:60px;

    border-radius:50%;

    border:2px solid white;

    background:#222b;

    color:white;

    font-size:12px;
}

@media(max-width:700px){

    #help{
        display:none;
    }

    #mobileControls{
        display:block;
    }

    .slot{
        width:43px;
        height:43px;

        font-size:20px;
    }

    .slot:nth-child(n+7){
        display:none;
    }
}

</style>
</head>

<body>


<div id="crosshair"></div>


<div id="hud">

    <div id="stats">

        ❤️ <span id="health">20</span>

        <br>

        📍 <span id="position">
            0, 0, 0
        </span>

    </div>


    <div id="help">

        WASD للحركة
        <br>

        SPACE للقفز
        <br>

        الزر الأيسر: تكسير
        <br>

        الزر الأيمن: بناء
        <br>

        1 - 8: اختيار البلوك
        <br>

        F: حفظ العالم

    </div>


    <div id="hotbar"></div>

</div>


<!-- Mobile -->

<div id="mobileControls">

    <div id="movement">

        <div
            class="mobileButton"
            id="up"
        >
            ▲
        </div>

        <div
            class="mobileButton"
            id="down"
        >
            ▼
        </div>

        <div
            class="mobileButton"
            id="left"
        >
            ◀
        </div>

        <div
            class="mobileButton"
            id="right"
        >
            ▶
        </div>

    </div>


    <div id="mobileActions">

        <button
            class="action"
            id="jumpButton"
        >
            قفز
        </button>

        <button
            class="action"
            id="breakButton"
        >
            كسر
        </button>

        <button
            class="action"
            id="placeButton"
        >
            بناء
        </button>

    </div>

</div>


<!-- Start -->

<div id="startScreen">

    <div class="startBox">

        <h1>
            ⛏️ BlockCraft
        </h1>

        <p>
            عالم ثلاثي الأبعاد مستوحى
            من ألعاب البناء والبقاء.
        </p>

        <p>
            ابنِ، اكسر، واستكشف عالمك.
        </p>

        <button id="playButton">
            ابدأ اللعب
        </button>

    </div>

</div>


<script type="module">

/* =====================================================
   THREE.JS
===================================================== */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js";


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x87ceeb
    );


scene.fog =
    new THREE.Fog(
        0x87ceeb,
        35,
        120
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.05,
        180
    );


camera.rotation.order =
    "YXZ";


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:false
    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.6
    )
);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const ambient =
    new THREE.HemisphereLight(
        0xbfe8ff,
        0x665544,
        1.5
    );


scene.add(
    ambient
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );


sun.position.set(
    35,
    60,
    20
);


sun.castShadow =
    true;


scene.add(
    sun
);


/* =====================================================
   MATERIALS
===================================================== */

const materials = {

    grass:
        new THREE.MeshLambertMaterial({
            color:0x55a83b
        }),

    dirt:
        new THREE.MeshLambertMaterial({
            color:0x8b5a2b
        }),

    stone:
        new THREE.MeshLambertMaterial({
            color:0x777777
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x8a5a2b
        }),

    leaves:
        new THREE.MeshLambertMaterial({
            color:0x2e8b3c,

            transparent:true,

            opacity:.9
        }),

    sand:
        new THREE.MeshLambertMaterial({
            color:0xd8c179
        }),

    glass:
        new THREE.MeshLambertMaterial({
            color:0x8ed6e8,

            transparent:true,

            opacity:.45
        }),

    water:
        new THREE.MeshLambertMaterial({
            color:0x237fd1,

            transparent:true,

            opacity:.6
        }),

    bedrock:
        new THREE.MeshLambertMaterial({
            color:0x303030
        })

};


/* =====================================================
   BLOCK TYPES
===================================================== */

const blockTypes = [

    "grass",
    "dirt",
    "stone",
    "wood",
    "leaves",
    "sand",
    "glass",
    "water"

];


const icons = [

    "🟩",
    "🟫",
    "⬜",
    "🪵",
    "🌿",
    "🟨",
    "🔷",
    "💧"

];


/* =====================================================
   WORLD
===================================================== */

const world =
    new Map();


const meshes =
    new Map();


const cube =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


function blockKey(
    x,
    y,
    z
){

    return (
        x +
        "|" +
        y +
        "|" +
        z
    );

}


/* =====================================================
   SET BLOCK
===================================================== */

function setBlock(
    x,
    y,
    z,
    type,
    save=true
){

    const key =
        blockKey(
            x,
            y,
            z
        );


    /* إزالة القديم */

    if(
        meshes.has(key)
    ){

        scene.remove(
            meshes.get(key)
        );

        meshes.delete(key);

    }


    /* حذف */

    if(
        type === null
    ){

        world.delete(key);

        dirty=true;

        return;

    }


    world.set(
        key,
        type
    );


    const mesh =
        new THREE.Mesh(
            cube,
            materials[type]
        );


    mesh.position.set(
        x + .5,
        y + .5,
        z + .5
    );


    mesh.castShadow =
        type !== "water" &&
        type !== "glass";


    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );


    meshes.set(
        key,
        mesh
    );


    if(save)
        dirty=true;

}


/* =====================================================
   TERRAIN
===================================================== */

function terrainHeight(
    x,
    z
){

    const noise =

        Math.sin(
            x * .16
        )

        +

        Math.sin(
            z * .13
        ) * .8

        +

        Math.sin(
            (x+z) * .055
        ) * 2;


    return Math.max(
        2,
        Math.floor(
            7 + noise * 1.7
        )
    );

}


function topAt(
    x,
    z
){

    for(
        let y=35;
        y>=0;
        y--
    ){

        const type =
            world.get(
                blockKey(
                    x,
                    y,
                    z
                )
            );


        if(
            type &&
            type !== "water" &&
            type !== "leaves"
        ){

            return y;

        }

    }


    return 0;

}


/* =====================================================
   GENERATE WORLD
===================================================== */

function generateWorld(){

    const radius =
        24;


    for(
        let x=-radius;
        x<=radius;
        x++
    ){

        for(
            let z=-radius;
            z<=radius;
            z++
        ){

            const height =
                terrainHeight(
                    x,
                    z
                );


            for(
                let y=0;
                y<=height;
                y++
            ){

                let type;


                if(y===0){

                    type="bedrock";

                }

                else if(
                    y===height
                ){

                    type="grass";

                }

                else if(
                    y>height-4
                ){

                    type="dirt";

                }

                else{

                    type="stone";

                }


                setBlock(
                    x,
                    y,
                    z,
                    type,
                    false
                );

            }


            /* Trees */

            if(
                Math.random() < .035 &&
                Math.abs(x)>3 &&
                Math.abs(z)>3 &&
                height>5
            ){

                for(
                    let y=height+1;
                    y<height+4;
                    y++
                ){

                    setBlock(
                        x,
                        y,
                        z,
                        "wood",
                        false
                    );

                }


                for(
                    let dx=-2;
                    dx<=2;
                    dx++
                ){

                    for(
                        let dz=-2;
                        dz<=2;
                        dz++
                    ){

                        for(
                            let dy=3;
                            dy<=4;
                            dy++
                        ){

                            if(
                                Math.abs(dx) +
                                Math.abs(dz)
                                < 4
                            ){

                                setBlock(
                                    x+dx,
                                    height+dy,
                                    z+dz,
                                    "leaves",
                                    false
                                );

                            }

                        }

                    }

                }

            }

        }

    }

}


/* =====================================================
   SAVE
===================================================== */

function saveWorld(){

    const data=[];


    for(
        const [key,type]
        of world
    ){

        data.push([
            key,
            type
        ]);

    }


    localStorage.setItem(
        "blockcraft_world",
        JSON.stringify(data)
    );


    dirty=false;

}


/* =====================================================
   LOAD
===================================================== */

function loadWorld(){

    const saved =
        localStorage.getItem(
            "blockcraft_world"
        );


    if(!saved){

        generateWorld();

        return;

    }


    try{

        const data =
            JSON.parse(
                saved
            );


        for(
            const [key,type]
            of data
        ){

            const [
                x,
                y,
                z
            ] =
            key
                .split("|")
                .map(Number);


            setBlock(
                x,
                y,
                z,
                type,
                false
            );

        }

    }
    catch(error){

        console.error(
            "World loading error:",
            error
        );

        localStorage.removeItem(
            "blockcraft_world"
        );

        generateWorld();

    }

}


let dirty=false;

loadWorld();


/* =====================================================
   PLAYER
===================================================== */

const player={

    x:.5,

    y:
        terrainHeight(
            0,
            0
        ) + 1.1,

    z:.5,

    velocityY:0,

    grounded:false

};


let yaw=0;

let pitch=0;

let pointerLocked=false;


camera.position.set(
    player.x,
    player.y+1.55,
    player.z
);


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};


addEventListener(
    "keydown",
    event=>{

        keys[event.code]=true;


        if(
            event.code==="Space"
        ){

            event.preventDefault();

        }


        if(
            event.key>="1" &&
            event.key<="8"
        ){

            selectBlock(
                Number(event.key)-1
            );

        }


        if(
            event.code==="KeyF"
        ){

            saveWorld();

        }

    }
);


addEventListener(
    "keyup",
    event=>{

        keys[event.code]=false;

    }
);


/* =====================================================
   POINTER LOCK
===================================================== */

renderer.addEventListener(
    "click",
    ()=>{

        const mobile =
            matchMedia(
                "(max-width:700px)"
            ).matches;


        if(!mobile){

            renderer.requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    ()=>{

        pointerLocked =
            document.pointerLockElement ===
            renderer.domElement;

    }
);


addEventListener(
    "mousemove",
    event=>{

        if(!pointerLocked)
            return;


        yaw -=
            event.movementX *
            .0022;


        pitch -=
            event.movementY *
            .0022;


        pitch =
            Math.max(
                -1.5,
                Math.min(
                    1.5,
                    pitch
                )
            );

    }
);


/* =====================================================
   HOTBAR
===================================================== */

const hotbar =
    document.getElementById(
        "hotbar"
    );


let selectedBlock=0;


blockTypes.forEach(
    (type,index)=>{

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot";


        slot.innerHTML =
            icons[index] +

            `<span class="slot-number">
                ${index+1}
            </span>`;


        if(index===0){

            slot.classList.add(
                "selected"
            );

        }


        slot.onclick=()=>{

            selectBlock(index);

        };


        hotbar.appendChild(
            slot
        );

    }
);


function selectBlock(index){

    selectedBlock=index;


    [
        ...hotbar.children
    ].forEach(
        (slot,i)=>{

            slot.classList.toggle(
                "selected",
                i===index
            );

        }
    );

}


/* =====================================================
   RAYCAST
===================================================== */

const raycaster =
    new THREE.Raycaster();


function getTarget(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );


    const hits =
        raycaster.intersectObjects(
            [
                ...meshes.values()
            ],
            false
        );


    return hits.find(
        hit =>
            hit.distance < 7
    );

}


/* =====================================================
   BREAK BLOCK
===================================================== */

function breakBlock(){

    const target =
        getTarget();


    if(!target)
        return;


    const position =
        target.object.position;


    const x =
        Math.floor(
            position.x
        );


    const y =
        Math.floor(
            position.y
        );


    const z =
        Math.floor(
            position.z
        );


    const type =
        world.get(
            blockKey(
                x,
                y,
                z
            )
        );


    if(
        type === "bedrock"
    )
        return;


    setBlock(
        x,
        y,
        z,
        null
    );


    saveWorld();

}


/* =====================================================
   PLACE BLOCK
===================================================== */

function placeBlock(){

    const target =
        getTarget();


    if(!target)
        return;


    const position =
        target.object.position
            .clone()
            .subScalar(.5);


    const normal =
        target.face.normal;


    const x =
        Math.floor(
            position.x +
            normal.x
        );


    const y =
        Math.floor(
            position.y +
            normal.y
        );


    const z =
        Math.floor(
            position.z +
            normal.z
        );


    if(
        y<1 ||
        y>40
    )
        return;


    if(
        world.has(
            blockKey(
                x,
                y,
                z
            )
        )
    )
        return;


    /* لا تحط البلوك داخل اللاعب */

    if(

        Math.abs(
            x-player.x
        ) < .8

        &&

        Math.abs(
            z-player.z
        ) < .8

        &&

        y >=
        Math.floor(
            player.y-1
        )

        &&

        y <=
        Math.floor(
            player.y+1
        )

    ){

        return;

    }


    setBlock(
        x,
        y,
        z,
        blockTypes[
            selectedBlock
        ]
    );


    saveWorld();

}


/* =====================================================
   MOUSE
===================================================== */

addEventListener(
    "mousedown",
    event=>{

        if(!pointerLocked)
            return;


        if(
            event.button===0
        ){

            breakBlock();

        }


        if(
            event.button===2
        ){

            placeBlock();

        }

    }
);


addEventListener(
    "contextmenu",
    event=>{

        event.preventDefault();

    }
);


/* =====================================================
   COLLISION
===================================================== */

function isSolid(
    x,
    y,
    z
){

    const type =
        world.get(
            blockKey(
                Math.floor(x),
                Math.floor(y),
                Math.floor(z)
            )
        );


    return Boolean(

        type &&

        type !== "water" &&

        type !== "leaves"

    );

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(dt){

    const speed =
        keys.ShiftLeft
            ? 7
            : 4.8;


    let moveX=0;

    let moveZ=0;


    if(keys.KeyW){

        moveX +=
            Math.sin(yaw);

        moveZ +=
            -Math.cos(yaw);

    }


    if(keys.KeyS){

        moveX -=
            Math.sin(yaw);

        moveZ -=
            -Math.cos(yaw);

    }


    if(keys.KeyA){

        moveX +=
            -Math.cos(yaw);

        moveZ +=
            -Math.sin(yaw);

    }


    if(keys.KeyD){

        moveX +=
            Math.cos(yaw);

        moveZ +=
            Math.sin(yaw);

    }


    const length =
        Math.hypot(
            moveX,
            moveZ
        );


    if(length){

        moveX =
            moveX /
            length *
            speed *
            dt;


        moveZ =
            moveZ /
            length *
            speed *
            dt;

    }


    /* Horizontal */

    const nextX =
        player.x +
        moveX;


    const nextZ =
        player.z +
        moveZ;


    const feet =
        Math.floor(
            player.y
        );


    const head =
        Math.floor(
            player.y+1.7
        );


    const clear =

        !isSolid(
            nextX+.28,
            feet,
            nextZ+.28
        )

        &&

        !isSolid(
            nextX-.28,
            feet,
            nextZ-.28
        )

        &&

        !isSolid(
            nextX+.28,
            head,
            nextZ+.28
        )

        &&

        !isSolid(
            nextX-.28,
            head,
            nextZ-.28
        );


    if(clear){

        player.x=nextX;

        player.z=nextZ;

    }


    /* Gravity */

    player.velocityY -=
        18 * dt;


    let nextY =
        player.y +
        player.velocityY *
        dt;


    if(
        player.velocityY <= 0
    ){

        const ground =
            topAt(
                Math.floor(
                    player.x
                ),
                Math.floor(
                    player.z
                )
            ) + 1;


        if(
            nextY <= ground
        ){

            nextY=ground;

            player.velocityY=0;

            player.grounded=true;

        }

    }
    else{

        player.grounded=false;

    }


    /* Jump */

    if(
        keys.Space &&
        player.grounded
    ){

        player.velocityY=7.2;

        player.grounded=false;

    }


    player.y=nextY;


    /* Falling reset */

    if(
        player.y < -10
    ){

        player.x=.5;

        player.z=.5;

        player.y =
            terrainHeight(
                0,
                0
            ) + 2;

        player.velocityY=0;

    }


    camera.position.set(
        player.x,
        player.y+1.55,
        player.z
    );


    camera.rotation.set(
        pitch,
        yaw,
        0
    );


    document
        .getElementById(
            "position"
        )
        .textContent =
        `${Math.floor(player.x)}, ${Math.floor(player.y)}, ${Math.floor(player.z)}`;

}


/* =====================================================
   MOBILE
===================================================== */

function mobileKey(
    id,
    key
){

    const button =
        document.getElementById(
            id
        );


    const start =
        event=>{

            event.preventDefault();

            keys[key]=true;

        };


    const stop =
        event=>{

            event.preventDefault();

            keys[key]=false;

        };


    button.addEventListener(
        "touchstart",
        start,
        {
            passive:false
        }
    );


    button.addEventListener(
        "touchend",
        stop,
        {
            passive:false
        }
    );


    button.addEventListener(
        "touchcancel",
        stop,
        {
            passive:false
        }
    );

}


mobileKey(
    "up",
    "KeyW"
);


mobileKey(
    "down",
    "KeyS"
);


mobileKey(
    "left",
    "KeyA"
);


mobileKey(
    "right",
    "KeyD"
);

/* =====================================================
   TOUCH CAMERA
===================================================== */

let lastTouch=null;


renderer.addEventListener(
    "touchstart",
    event=>{

        if(
            event.touches.length===1
        ){

            lastTouch={

                x:
                    event.touches[0]
                        .clientX,

                y:
                    event.touches[0]
                        .clientY

            };

        }

    },
    {
        passive:false
    }
);


renderer.addEventListener(
    "touchmove",
    event=>{

        if(
            !lastTouch ||
            event.touches.length!==1
        )
            return;


        event.preventDefault();


        const touch =
            event.touches[0];


        const dx =
            touch.clientX -
            lastTouch.x;


        const dy =
            touch.clientY -
            lastTouch.y;


        yaw -=
            dx * .004;


        pitch -=
            dy * .004;


        pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );


        lastTouch={

            x:touch.clientX,

            y:touch.clientY

        };

    },
    {
        passive:false
    }
);


renderer.addEventListener(
    "touchend",
    ()=>{

        lastTouch=null;

    }
);


/* =====================================================
   START GAME
===================================================== */

document
    .getElementById(
        "playButton"
    )
    .onclick=()=>{

        document
            .getElementById(
                "startScreen"
            )
            .style.display="none";


        const mobile =
            matchMedia(
                "(max-width:700px)"
            ).matches;


        if(!mobile){

            renderer.requestPointerLock();

        }

    };


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   AUTO SAVE
===================================================== */

setInterval(
    ()=>{

        if(dirty){

            saveWorld();

        }

    },
    15000
);


addEventListener(
    "beforeunload",
    ()=>{

        saveWorld();

    }
);


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime =
    performance.now();


function gameLoop(time){

    requestAnimationFrame(
        gameLoop
    );


    const dt =
        Math.min(
            (time-lastTime)/1000,
            .05
        );


    lastTime=time;


    updatePlayer(
        dt
    );


    renderer.render(
        scene,
        camera
    );

}


requestAnimationFrame(
    gameLoop
);

</script>
