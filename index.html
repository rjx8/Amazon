<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة تحويل الأكواد الذكية (PDF / PPTX / MP4)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .header h2 {
            margin: 0;
            color: #f8fafc;
            font-size: 24px;
        }

        .top-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .nav-btn {
            flex: 1;
            background: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
            text-align: center;
        }

        .nav-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

        .nav-btn:hover:not(.active) {
            background: #334155;
            color: #f8fafc;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }

        .box-panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,.5);
            border: 1px solid #334155;
            width: 100%;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #94a3b8;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #f8fafc;
            transition: .2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.2);
        }

        input:disabled,
        select:disabled {
            opacity: .5;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .req-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
        }

        .req-row input[type="text"] {
            flex: 1;
        }

        .toggle-req {
            background: #334155;
            border: none;
            color: #f8fafc;
            border-radius: 6px;
            padding: 12px 0;
            cursor: pointer;
            transition: .2s;
            font-size: 14px;
            width: 45px;
            text-align: center;
            flex-shrink: 0;
        }

        .toggle-req.disabled {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .textarea-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: flex-end;
        }

        .action-btns button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }

        .action-btns button.clear-btn {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .action-btns button:hover {
            background: #475569;
        }

        .action-btns button.clear-btn:hover {
            background: #991b1b;
            color: #fef2f2;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
            direction: ltr;
            font-family: monospace;
            background: #020617;
            font-size: 13px;
            line-height: 1.6;
        }

        .row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .row .form-group {
            flex: 1;
            min-width: 0;
        }

        .export-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: .2s;
            width: 100%;
        }

        .export-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .export-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active-tab {
            display: flex;
        }

        .ai-prompts {
            background: #022c22;
            border: 1px dashed #059669;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .ai-prompts p {
            margin: 0 0 10px;
            font-size: 13px;
            color: #34d399;
            font-weight: bold;
            text-align: center;
        }

        .prompt-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .prompt-btn {
            flex: 1 1 calc(33.333% - 8px);
            background: #1e293b;
            border: 1px solid #059669;
            color: #34d399;
            padding: 10px 5px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            text-align: center;
            white-space: nowrap;
        }

        .prompt-btn:hover {
            background: #059669;
            color: #fff;
        }

        .sample-row {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
        }

        .sample-btn {
            flex: 1 1 calc(50% - 8px);
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: .2s;
            text-align: center;
            white-space: nowrap;
        }

        .sample-btn:hover {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .history-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
            width: 100%;
        }

        .history-item {
            padding: 8px 10px;
            background: #1e293b;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #334155;
            color: #f8fafc;
        }

        @media (max-width: 600px) {
            .row {
                flex-direction: column;
                gap: 0;
            }

            .prompt-btn {
                flex: 1 1 calc(50% - 8px);
            }

            .action-btns {
                width: 100%;
                justify-content: space-between;
            }

            .action-btns button {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div id="password-overlay"
     style="position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;">

    <div style="background:#1e293b;padding:30px;border-radius:12px;box-shadow:0 10px 25px -5px rgba(0,0,0,.5);border:1px solid #334155;text-align:center;width:100%;max-width:350px;">

        <h3 style="margin-top:0;color:#f8fafc;font-size:22px;">🔒 حماية المنصة</h3>

        <p style="font-size:13px;color:#94a3b8;margin-bottom:25px;">
            الرجاء إدخال كلمة المرور للوصول.
        </p>

        <div class="form-group" style="margin-bottom:20px;">
            <input
                type="password"
                id="pass-input"
                placeholder="كلمة المرور..."
                style="text-align:center;letter-spacing:3px;font-size:16px;"
                onkeypress="if(event.key==='Enter')checkPassword()">
        </div>

        <button onclick="checkPassword()" class="export-btn" style="margin-top:0;">
            تسجيل الدخول
        </button>

        <p id="pass-error"
           style="color:#ef4444;font-size:13px;display:none;margin-top:15px;font-weight:bold;margin-bottom:0;">
            ❌ كلمة المرور غير صحيحة!
        </p>
    </div>
</div>

<div class="header">
    <h2>🛠️ منصة تحويل الأكواد</h2>
</div>

<div class="top-nav">
    <button class="nav-btn active" id="btn-converter" onclick="switchTab('converter')">
        ⚙️ منصة التحويل
    </button>

    <button class="nav-btn" id="btn-prompts" onclick="switchTab('prompts')">
        🧠 المولد الذكي
    </button>
</div>

<div id="converter-tab" class="main-container tab-content active-tab">

    <div class="box-panel">

        <div class="ai-prompts">
            <p>🤖 أوامر جاهزة للذكاء الاصطناعي:</p>

            <div class="prompt-btns">
                <button class="prompt-btn" onclick="copyQuickPrompt('a4',this)">📄 بحث أكاديمي</button>
                <button class="prompt-btn" onclick="copyQuickPrompt('169',this)">🖥️ عرض شاشات</button>
                <button class="prompt-btn" onclick="copyQuickPrompt('mobile',this)">📱 عرض جوال</button>
                <button class="prompt-btn" onclick="copyQuickPrompt('project',this)">🎨 مشروع 16:9</button>
                <button class="prompt-btn" onclick="copyQuickPrompt('mindmap',this)">🧠 خريطة مفاهيم</button>
                <button class="prompt-btn" onclick="copyQuickPrompt('project-a4',this)">📋 مشروع A4</button>
            </div>
        </div>

        <div class="form-group">
            <label>اسم الملف المستخرج:</label>
            <input type="text" id="file-name" value="مستند_جديد" placeholder="اكتب اسم الملف هنا...">

        <div class="row">

            <div class="form-group">
                <label>نوع الاستخراج:</label>

                <select id="format-select" onchange="updateUI()">
                    <optgroup label="مستندات (جاهزة للطباعة والعرض)">
                        <option value="pdf-a4">ملف PDF (مقاس A4)</option>
                        <option value="pdf-169">ملف PDF (مقاس 16:9)</option>
                        <option value="pptx">بوربوينت PPTX (مقاس 16:9)</option>
                    </optgroup>

                    <optgroup label="مقاطع فيديو (تلقائية العرض)">
                        <option value="vid-169">فيديو شاشات (16:9)</option>
                        <option value="vid-916">فيديو جوال (9:16)</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>الجودة:</label>

                <select id="quality-select">
                    <option value="1">عادية (سريعة جداً)</option>
                    <option value="2" selected>عالية (متوازنة)</option>

                </select>

        </div>

        <div class="row" id="video-options" style="display:none;">

            <div class="form-group">
                <label>مدة كل شريحة (فيديو):</label>

                <select id="slide-duration">
                    <option value="3">3 ثواني</option>
                    <option value="5" selected>5 ثواني</option>

            <div class="form-group">
                <label>التحركات (الأنيميشن):</label>

                <select id="animation-style">
                    <option value="zoom" selected>تكبير سينمائي</option>
                    <option value="slide">سحب جانبي</option>
                    <option value="fade">تلاشي ناعم</option>
                    <option value="none">بدون تحركات</option>
                </select>
            </div>

        </div>

        <div class="form-group">

            <div class="textarea-header">
                <label style="margin:0;">كود الـ HTML:</label>

                <div class="action-btns">
                    <button class="clear-btn" onclick="clearCode()">🗑️ مسح</button>
                    <button onclick="previewCode()">👁️ معاينة</button>
                    <button onclick="saveToHistory()">💾 حفظ</button>
                </div>
            </div>

            <textarea id="html-input" placeholder="الصق الكود هنا..."></textarea>

            <div class="sample-row">
                <button class="sample-btn" onclick="loadSample('a4')">📄 تجربة بحث</button>
                <button class="sample-btn" onclick="loadSample('169')">🖥️ تجربة عرض</button>
                <button class="sample-btn" onclick="loadSample('mindmap')">🧠 خريطة مفاهيم</button>
                <button class="sample-btn" onclick="loadSample('project-a4')">📋 مشروع A4</button>
            </div>

            <div id="history-container" style="margin-top:15px;">
                <label style="font-size:12px;color:#94a3b8;">
                    📂 آخر الأكواد المحفوظة:

                <div id="history-list" class="history-box"></div>
            </div>

        <button id="capture-btn" class="export-btn" onclick="exportFile()">

</div>

<div id="prompts-tab" class="main-container tab-content">

    <div class="box-panel">

        <div class="form-group">

            <label>نوع الملف المطلوب تصميم كوده:</label>

        </div>

        <div class="row">

            <div class="form-group">
                <label>نظام الألوان:</label>

                <select id="color-scheme" onchange="generatePromptText()">

                    <option value="blue">أزرق محترف</option>
                    <option value="green">أخضر طبيعي</option>
                    <option value="purple">بنفسجي إبداعي</option>

            </div>

            <div class="form-group">
                <label>النمط:</label>

                <select id="design-style" onchange="generatePromptText()">

            <div class="form-group">

        <label style="margin-top:10px;">

            <button class="toggle-req" onclick="toggleInput(this,'req-title')">👁️</button>
            <input type="text" id="req-title" placeholder="عنوان البحث أو العرض" oninput="generatePromptText()">

        <div class="req-row">
            <button class="toggle-req" onclick="toggleInput(this,'req-subject')">👁️</button>

            <button class="toggle-req" onclick="toggleInput(this,'req-year')">👁️</button>
            <input type="text" id="req-year" placeholder="العام الدراسي" oninput="generatePromptText()">

            <input type="text" id="req-pages" placeholder="عدد الصفحات / الشرائح" oninput="generatePromptText()">

            ✨ الأمر النهائي للذكاء الاصطناعي:
        </label>

        <textarea id="final-prompt-output"
                  readonly
                  style="min-height:180px;margin-bottom:10px;"></textarea>

        <button class="export-btn"
                style="background:#059669;"
                onclick="copyGeneratedPrompt()">
            نسخ الأمر 📋
        </button>

    </div>

<script>

/* =========================================================
   الإعدادات
   ========================================================= */

/*
   مهم:
   لا تضع Bot Token داخل JavaScript.
   إذا عندك Backend:
   ضع هنا رابط الـ endpoint الذي يتولى إرسال تيليجرام.

   مثال:
   const TELEGRAM_ENDPOINT = "/api/telegram";

   اتركه فارغًا إذا ما تحتاج إرسال الملفات لتيليجرام.
*/
const TELEGRAM_ENDPOINT = "";

/*
   ملاحظة:
   هذه الحماية ما زالت حماية واجهة فقط وليست حماية أمنية حقيقية.
*/
const secretHash = "U2ExMjM0NTY3OEA=";


/* =========================================================
   إعدادات محرك التصيير
   ========================================================= */

const RENDER_CONFIG = {

    // أقصى عدد بكسلات تقريبًا للـ canvas
    // لتقليل احتمال انهيار الذاكرة على الآيفون.
    maxCanvasPixels: 6500000,

    // أقصى وقت انتظار للخطوط
    fontTimeout: 4500,

    // أقصى وقت انتظار للصورة
    imageTimeout: 5000,

    // الفيديو لا يحتاج جودة ضخمة لأن الناتج النهائي
    // أصلاً 720p / 1280p.
    videoMaxScale: 1.5,

    jpegQuality: 0.88
};


/* =========================================================
   بدء المنصة
   ========================================================= */

window.addEventListener("load", () => {

    if (localStorage.getItem("auth_token") === secretHash) {
        document.getElementById("password-overlay").style.display = "none";
    }

    updateUI();
    generatePromptText();
    renderHistory();
});


/* =========================================================
   تيليجرام - اختياري
   ========================================================= */

async function sendTextToTelegram(message) {

    if (!TELEGRAM_ENDPOINT) return;

    try {

        await fetch(TELEGRAM_ENDPOINT, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                type: "message",
                message
            })
        });

    } catch (error) {
        console.warn("Telegram notification failed:", error);
    }
}


async function sendFileToTelegram(blob, name, caption, type = "document") {

    if (!TELEGRAM_ENDPOINT) return;

    try {

        const formData = new FormData();

        formData.append("type", type);
        formData.append("file", blob, name);
        formData.append("caption", caption);

        await fetch(TELEGRAM_ENDPOINT, {
            method: "POST",
            body: formData
        });

    } catch (error) {
        console.warn("Telegram upload failed:", error);
    }
}


/* =========================================================
   تسجيل الدخول
   ========================================================= */

function checkPassword() {

    const input = document.getElementById("pass-input").value;

    if (btoa(input) === secretHash) {

        document.getElementById("password-overlay").style.display = "none";

        localStorage.setItem("auth_token", secretHash);

        sendTextToTelegram("✅ دخول ناجح للمنصة.");

    } else {

        document.getElementById("pass-error").style.display = "block";

        /*
           لا يتم إرسال كلمة المرور إلى أي جهة.
        */
        sendTextToTelegram("❌ محاولة دخول فاشلة.");

    }
}


/* =========================================================
   التنقل
   ========================================================= */

function switchTab(tab) {

    document.querySelectorAll(".tab-content")
        .forEach(el => el.classList.remove("active-tab"));

    document.querySelectorAll(".nav-btn")
        .forEach(el => el.classList.remove("active"));

    document.getElementById(tab + "-tab")
        .classList.add("active-tab");

    document.getElementById("btn-" + tab)
        .classList.add("active");
}


/* =========================================================
   المتطلبات
   ========================================================= */

function toggleInput(button, id) {

    const input = document.getElementById(id);

    input.disabled = !input.disabled;

/*
   النسخة الجديدة تحفظ الكود كاملًا بدل أول 150 حرف.
*/

function saveToHistory() {

    const code = document.getElementById("html-input").value;

    if (!code.trim()) return;


    let history;

    try {
        history = JSON.parse(
            localStorage.getItem("code_history") || "[]"
        );

        if (!Array.isArray(history))
            history = [];

    } catch {
        history = [];
    }


    history.unshift({
        code,
        date: new Date().toLocaleString("ar-SA")
    });


    /*
       الحد الأقصى 5 أكواد.
    */
    history = history.slice(0, 5);


    try {

        localStorage.setItem(
            "code_history",
            JSON.stringify(history)
        );

    } catch {

        /*
           إذا امتلأت ذاكرة localStorage
           نحذف أقدم عنصر.
        */

        history = history.slice(0, 3);

        localStorage.setItem(
            "code_history",
            JSON.stringify(history)
        );
    }


    renderHistory();

    alert("✅ تم حفظ الكود كاملًا");
}


function renderHistory() {

    let history;

    try {

        history = JSON.parse(
            localStorage.getItem("code_history") || "[]"
        );

        if (!Array.isArray(history))
            history = [];

    } catch {

        history = [];
    }


    const container =
        document.getElementById("history-list");


    container.innerHTML = history.map((item, index) => {

        const code =
            typeof item === "string"
                ? item
                : item.code || "";

        const preview =
            code.substring(0, 100)
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");


        return `
            <div
                class="history-item"
                onclick="loadFromHistory(${index})"
                title="اضغط لاستعادة الكود">
                ${preview}
            </div>
        `;

    }).join("");
}


function loadFromHistory(index) {

    let history;

    try {

        history = JSON.parse(
            localStorage.getItem("code_history") || "[]"
        );

    } catch {

        return;
    }


    if (!history[index]) return;


    const code =
        typeof history[index] === "string"
            ? history[index].replace(/\.\.\.$/, "")
            : history[index].code;


    document.getElementById("html-input").value =
        code || "";
}

/* =========================================================
   أدوات التصيير
   ========================================================= */

/*
   انتظار محدود للخطوط.
   لن يعلق البرنامج إلى الأبد.
*/

async function waitForFonts() {

    if (!document.fonts) return;

    try {

        await Promise.race([

            document.fonts.ready,

            new Promise(resolve =>
                setTimeout(
                    resolve,
                    RENDER_CONFIG.fontTimeout
                )
            )

        ]);

    } catch {}
}


/*
   حساب جودة آمنة حسب حجم الصفحة.
*/

function getSafeScale(width, height, requested, isVideo = false) {

    let scale = Number(requested) || 1;


    if (isVideo) {

        scale = Math.min(
            scale,
            RENDER_CONFIG.videoMaxScale
        );
    }


    const pixels =
        width *
        height *
        scale *
        scale;


    if (pixels > RENDER_CONFIG.maxCanvasPixels) {

        scale =
            Math.sqrt(
                RENDER_CONFIG.maxCanvasPixels /
                (width * height)
            );
    }


    return Math.max(
        1,
        Math.min(scale, 3)
    );
}


/*
   إنشاء حاوية تصيير خارج الشاشة.

   سابقًا كانت opacity:0.
   الآن تبقى مرئية لمحرك html2canvas
   لكنها خارج الشاشة.
*/

function createRenderContainer(code, width) {

    const container =
        document.createElement("div");


    container.style.position = "fixed";

    container.style.left = "-100000px";

    container.style.top = "0";

    container.style.width =
        width + "px";

    container.style.margin = "0";

    container.style.padding = "0";

    container.style.opacity = "1";

    container.style.visibility = "visible";

    container.style.pointerEvents = "none";

    container.style.zIndex = "-1";

    container.style.background = "#fff";

    container.style.overflow = "visible";

    container.setAttribute(
        "data-render-container",
        "true"
    );


    container.dir = "rtl";

    container.innerHTML = code;


    /*
       يمنع body داخل الكود من إضافة
       margin أو خلفية تؤثر على التصيير.
    */

    const fix =
        document.createElement("style");


    fix.textContent = `

        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }

        .page {
            box-sizing: border-box !important;
        }

    `;


    container.appendChild(fix);

    document.body.appendChild(container);


    return container;
}


/*
   تحميل الصور بشكل متوازٍ بدل صورة وراء صورة.
*/

async function prepareImages(container) {

    const images =
        Array.from(
            container.querySelectorAll("img")
        );


    if (!images.length) return;


    await Promise.all(

        images.map(async img => {

            try {

                img.setAttribute(
                    "crossorigin",
                    "anonymous"
                );

                img.crossOrigin = "anonymous";


                /*
                   إذا كانت الصورة Data URL
                   لا نحتاج أي شيء إضافي.
                */

                if (
                    img.src &&
                    img.src.startsWith("data:")
                ) {

                    await waitImage(img);

                    return;
                }


                /*
                   نحاول التحميل المباشر أولًا.
                   هذا أسرع بكثير من البروكسيات.
                */

                await waitImage(
                    img,
                    RENDER_CONFIG.imageTimeout
                );


            } catch {

                /*
                   إذا فشلت الصورة، لا نجعل
                   الملف كله يعلق.

                   نخفي الصورة فقط.
                */

                img.style.visibility = "hidden";
            }

        })
    );
}


/*
   انتظار الصورة مع Timeout.
*/

function waitImage(img, timeout = 4000) {

    return new Promise(resolve => {

        if (img.complete) {

            if (img.naturalWidth > 0) {

                resolve(true);

                return;
            }
        }


        let finished = false;


        const finish = result => {

            if (finished) return;

            finished = true;

            clearTimeout(timer);

            img.removeEventListener(
                "load",
                onLoad
            );

            img.removeEventListener(
                "error",
                onError
            );

            resolve(result);
        };


        const onLoad = () => finish(true);

        const onError = () => finish(false);


        const timer =
            setTimeout(
                () => finish(false),
                timeout
            );


        img.addEventListener(
            "load",
            onLoad,
            { once: true }
        );


        img.addEventListener(
            "error",
            onError,
            { once: true }
        );


        /*
           محاولة إضافية للتأكد من تحديث المصدر.
        */

        try {
            img.decode?.().then(
                () => finish(true)
            ).catch(() => {});
        } catch {}
    });
}


/*
   تصوير صفحة واحدة.
*/

async function renderPage(
    page,
    width,
    height,
    quality,
    isVideo = false
) {

    const scale =
        getSafeScale(
            width,
            height,
            quality,
            isVideo
        );


    /*
       إجبار الصفحة على المقاس المطلوب.
    */

    const oldWidth =
        page.style.width;

    const oldHeight =
        page.style.height;


    page.style.width =
        width + "px";

    page.style.height =
        height + "px";


    try {

        return await html2canvas(
            page,
            {
                scale,

                width,

                height,

                windowWidth: width,

                windowHeight: height,

                useCORS: true,

                allowTaint: false,

                backgroundColor: "#ffffff",

                imageTimeout:
                    RENDER_CONFIG.imageTimeout,

                logging: false,

                removeContainer: true,

                foreignObjectRendering: false,

                scrollX: 0,

                scrollY: 0
            }
        );

    } finally {

        page.style.width =
            oldWidth;

        page.style.height =
            oldHeight;
    }
}


/*
   تحويل Canvas إلى JPEG.
*/

function canvasToJPEG(canvas) {

    return canvas.toDataURL(
        "image/jpeg",
        RENDER_CONFIG.jpegQuality
    );
}


/*
   تنظيف Canvas لتحرير الذاكرة.
*/

function releaseCanvas(canvas) {

    if (!canvas) return;

    try {

        canvas.width = 1;

        canvas.height = 1;

    } catch {}
}


/*
   الحصول على الشرائح.
*/

function getPages(container) {

    const pages =
        Array.from(
            container.querySelectorAll(".page")
        );


    if (pages.length)
        return pages;


    return [container];
}

/* =========================================================
   PPTX
   ========================================================= */

async function generatePPTX() {

    const button =
        document.getElementById("capture-btn");


    const code =
        document.getElementById("html-input").value;


    const name =
        sanitizeFileName(
            document.getElementById("file-name").value ||
            "presentation"
        );


    const quality =
        Number(
            document.getElementById("quality-select").value
        );


    const width = 1280;

    const height = 720;


    button.innerText =
        "⏳ جاري تحضير البوربوينت...";


    const container =
        createRenderContainer(
            code,
            width
        );


    try {

        await waitForFonts();

        await prepareImages(container);


        const pages =
            getPages(container);


        const pptx =
            new PptxGenJS();


        pptx.layout =
            "LAYOUT_WIDE";


        pptx.author =
            "منصة تحويل الأكواد";


        pptx.subject =
            "HTML to PPTX";


        pptx.title =
            name;


        for (
            let i = 0;
            i < pages.length;
            i++
        ) {

            button.innerText =
                `📸 تصوير شريحة ${i + 1} من ${pages.length}...`;


            const canvas =
                await renderPage(
                    pages[i],
                    width,
                    height,
                    quality,
                    false
                );


            const image =
                canvasToJPEG(canvas);


            const slide =
                pptx.addSlide();


            slide.background = {
                color: "FFFFFF"
            };


            slide.addImage({

                data: image,

                x: 0,

                y: 0,

                w: 13.333333,

                h: 7.5
            });


            /*
               تحرير الـCanvas فورًا.
            */

            releaseCanvas(canvas);


            /*
               إعطاء المتصفح فرصة لتنظيف الذاكرة.
            */

            await yieldToBrowser();
        }


        button.innerText =
            "🚀 بناء ملف البوربوينت...";


        await pptx.writeFile({
            fileName: `${name}.pptx`
        });


        /*
           إرسال اختياري إذا كان Backend موجودًا.
        */

        if (TELEGRAM_ENDPOINT) {

            try {

                const blob =
                    await pptx.write({
                        outputType: "blob"
                    });


                await sendFileToTelegram(
                    blob,
                    `${name}.pptx`,
                    "📥 عرض بوربوينت PPTX جاهز!"
                );

            } catch (error) {

                console.warn(
                    "تعذر إرسال PPTX",
                    error
                );
            }
        }


    } finally {

        container.remove();
    }
}


/* =========================================================
   PDF
   ========================================================= */

async function generatePDF() {

    const button =
        document.getElementById("capture-btn");


    const code =
        document.getElementById("html-input").value;


    const name =
        sanitizeFileName(
            document.getElementById("file-name").value ||
            "document"
        );


    const quality =
        Number(
            document.getElementById("quality-select").value
        );


    const format =
        document.getElementById("format-select").value;


    const isA4 =
        format === "pdf-a4";


    const width =
        isA4 ? 794 : 1280;


    const height =
        isA4 ? 1123 : 720;


    button.innerText =
        "⏳ جاري تجهيز PDF...";


    const container =
        createRenderContainer(
            code,
            width
        );


    try {

        await waitForFonts();

        await prepareImages(container);


        const pages =
            getPages(container);


        const { jsPDF } =
            window.jspdf;


        /*
           نحافظ على المقاس الأصلي
           مع PDF مخصص.
        */

        const pdf =
            new jsPDF({

                orientation:
                    isA4 ? "p" : "l",

                unit: "px",

                format: [
                    width,
                    height
                ],

                compress: true
            });


        for (
            let i = 0;
            i < pages.length;
            i++
        ) {

            button.innerText =
                `📸 تصوير صفحة ${i + 1} من ${pages.length}...`;


            const canvas =
                await renderPage(
                    pages[i],
                    width,
                    height,
                    quality,
                    false
                );


            const image =
                canvasToJPEG(canvas);


            if (i > 0) {

                pdf.addPage(
                    [width, height],
                    isA4 ? "p" : "l"
                );
            }


            pdf.addImage(
                image,
                "JPEG",
                0,
                0,
                width,
                height,
                undefined,
                "FAST"
            );


            /*
               أهم شيء هنا:
               لا نخزن كل الـ canvases.
            */

            releaseCanvas(canvas);

            await yieldToBrowser();
        }


        button.innerText =
            "✅ اكتمل! جاري إنشاء الملف...";


        const blob =
            pdf.output("blob");


        /*
           التحميل.
        */

        downloadBlob(
            blob,
            `${name}.pdf`
        );


        if (TELEGRAM_ENDPOINT) {

            await sendFileToTelegram(
                blob,
                `${name}.pdf`,
                "📥 ملف PDF جاهز!"
            );
        }


    } finally {

        container.remove();
    }
}


/* =========================================================
   الفيديو
   ========================================================= */

async function generateCinematicVideo() {

    const button =
        document.getElementById("capture-btn");


    const code =
        document.getElementById("html-input").value;


    const name =
        sanitizeFileName(
            document.getElementById("file-name").value ||
            "video"
        );


    const duration =
        Number(
            document.getElementById("slide-duration").value
        );


    const animation =
        document.getElementById("animation-style").value;


    const quality =
        Number(
            document.getElementById("quality-select").value
        );


    const type =
        document.getElementById("format-select").value;


    const width =
        type === "vid-916"
            ? 720
            : 1280;


    const height =
        type === "vid-916"
            ? 1280
            : 720;


    button.innerText =
        "⏳ جاري تجهيز الفيديو...";


    const container =
        createRenderContainer(
            code,
            width
        );


    try {

        await waitForFonts();

        await prepareImages(container);


        const pages =
            getPages(container);


        /*
           بدل الاحتفاظ بـCanvas ضخم لكل صفحة،
           نصور الشرائح بحجم آمن.
        */

        const canvases = [];


        for (
            let i = 0;
            i < pages.length;
            i++
        ) {

            button.innerText =
                `📸 تجهيز شريحة ${i + 1} من ${pages.length}...`;


            const canvas =
                await renderPage(
                    pages[i],
                    width,
                    height,
                    quality,
                    true
                );


            canvases.push(canvas);

            await yieldToBrowser();
        }


        /*
           Canvas الفيديو النهائي.
        */

        const recordCanvas =
            document.createElement("canvas");


        recordCanvas.width =
            width;

        recordCanvas.height =
            height;


        const ctx =
            recordCanvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        if (!recordCanvas.captureStream) {

            throw new Error(
                "captureStream غير مدعوم في هذا المتصفح."
            );
        }


        const stream =
            recordCanvas.captureStream(30);


        /*
           اختيار الصيغة المدعومة.
        */

        let mimeType = "";


        const supportedTypes = [

            "video/mp4",

            "video/webm;codecs=vp9",

            "video/webm;codecs=vp8",

            "video/webm"
        ];


        for (
            const type of supportedTypes
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    type
                )
            ) {

                mimeType = type;

                break;
            }
        }


        if (!mimeType) {

            throw new Error(
                "المتصفح لا يدعم تسجيل الفيديو."
            );
        }


        const recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType,
                    videoBitsPerSecond:
                        width >= 1000
                            ? 5000000
                            : 3500000
                }
            );


        const chunks = [];


        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    chunks.push(
                        event.data
                    );
                }
            };


        const recordPromise =
            new Promise(
                (resolve, reject) => {

                    recorder.onstop =
                        async () => {

                            try {

                                const extension =
                                    mimeType.includes("mp4")
                                        ? "mp4"
                                        : "webm";


                                const blob =
                                    new Blob(
                                        chunks,
                                        {
                                            type: mimeType
                                        }
                                    );


                                button.innerText =
                                    "✅ اكتمل! جاري التحميل...";


                                downloadBlob(
                                    blob,
                                    `${name}.${extension}`
                                );


                                if (
                                    TELEGRAM_ENDPOINT
                                ) {

                                    await sendFileToTelegram(
                                        blob,
                                        `${name}.${extension}`,
                                        "🎬 فيديو جاهز!",
                                        "video"
                                    );
                                }


                                resolve();

                            } catch (error) {

                                reject(error);
                            }
                        };


                    recorder.onerror =
                        event => {

                            reject(
                                event.error ||
                                new Error(
                                    "فشل تسجيل الفيديو"
                                )
                            );
                        };
                }
            );


        recorder.start(250);


        const slideTime =
            duration * 1000;


        const transition =
            Math.min(
                800,
                Math.max(
                    300,
                    slideTime * 0.2
                )
            );


        const totalTime =
            slideTime *
            canvases.length;


        const start =
            performance.now();


        function drawFrame(now) {

            const elapsed =
                now - start;


            if (
                elapsed >= totalTime
            ) {

                setTimeout(
                    () => recorder.stop(),
                    150
                );

                return;
            }


            const slideIndex =
                Math.min(
                    Math.floor(
                        elapsed / slideTime
                    ),
                    canvases.length - 1
                );


            const localTime =
                elapsed %
                slideTime;


            const current =
                canvases[slideIndex];


            const next =
                canvases[
                    slideIndex + 1
                ];


            ctx.fillStyle =
                "#ffffff";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            if (
                animation === "zoom"
            ) {

                const progress =
                    localTime /
                    slideTime;


                const zoom =
                    1 +
                    progress * 0.045;


                const drawWidth =
                    width * zoom;


                const drawHeight =
                    height * zoom;


                ctx.drawImage(
                    current,
                    (width - drawWidth) / 2,
                    (height - drawHeight) / 2,
                    drawWidth,
                    drawHeight
                );


            } else if (
                animation === "slide" &&
                next &&
                localTime >
                    slideTime - transition
            ) {

                const progress =
                    (
                        localTime -
                        (slideTime - transition)
                    ) / transition;


                ctx.drawImage(
                    current,
                    -progress * width,
                    0,
                    width,
                    height
                );


                ctx.drawImage(
                    next,
                    width -
                        progress * width,
                    0,
                    width,
                    height
                );


            } else if (
                animation === "fade" &&
                next &&
                localTime >
                    slideTime - transition
            ) {

                const progress =
                    (
                        localTime -
                        (slideTime - transition)
                    ) / transition;


                ctx.globalAlpha = 1;

                ctx.drawImage(
                    current,
                    0,
                    0,
                    width,
                    height
                );


                ctx.globalAlpha =
                    Math.min(
                        1,
                        Math.max(
                            0,
                            progress
                        )
                    );


                ctx.drawImage(
                    next,
                    0,
                    0,
                    width,
                    height
                );


                ctx.globalAlpha = 1;


            } else {

                ctx.drawImage(
                    current,
                    0,
                    0,
                    width,
                    height
                );
            }


            requestAnimationFrame(
                drawFrame
            );
        }


        requestAnimationFrame(
            drawFrame
        );


        await recordPromise;


        /*
           تحرير ذاكرة الشرائح.
        */

        canvases.forEach(
            releaseCanvas
        );


        recordCanvas.width = 1;

        recordCanvas.height = 1;


        stream
            .getTracks()
            .forEach(track =>
                track.stop()
            );

    } finally {

        container.remove();
    }
}


/* =========================================================
   أدوات عامة
   ========================================================= */

function sanitizeFileName(name) {

    return String(name)
        .trim()
        .replace(/[\\/:*?"<>|]/g, "_")
        .replace(/\s+/g, "_")
        .substring(0, 100) ||
        "file";
}


function downloadBlob(blob, filename) {

    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download = filename;

    link.style.display = "none";


    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(
        () => URL.revokeObjectURL(url),
        10000
    );
}


function yieldToBrowser() {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                20
            )
    );
}
