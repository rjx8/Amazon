<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
      margin: 0;
      font-family: sans-serif;
    }

    .matrix-table {
      border-collapse: collapse;
      border: 2px solid #000;
      background-color: #fff;
    }

    .matrix-table td, .matrix-table th {
      width: 60px;
      height: 45px;
      border: 2px solid #000;
      text-align: center;
      vertical-align: middle;
      padding: 0;
      box-sizing: border-box;
    }

    /* رأس الجدول والعمود الجانبي باللون الوردي */
    .pink-bg {
      background-color: #fca5a5;
    }

    /* الخلايا الحمراء الداكنة القطرية */
    .dark-red-bg {
      background-color: #7f1d1d;
    }

    /* خلية العنوان المقسومة بالخط المائل */
    .split-cell {
      position: relative;
      background-color: #fff;
      overflow: hidden;
    }

    .split-cell::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top right, transparent calc(50% - 1px), #000 50%, transparent calc(50% + 1px));
    }
  </style>
</head>
<body>

  <table class="matrix-table">
    <!-- الصف الأول (العناوين العلويّة) -->
    <tr>
      <th class="pink-bg"></th>
      <th class="pink-bg"></th>
      <th class="pink-bg"></th>
      <th class="pink-bg"></th>
      <th class="pink-bg"></th>
      <th class="pink-bg"></th>
      <th class="split-cell"></th>
    </tr>

    <!-- الصف 1 -->
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td class="dark-red-bg"></td>
      <td class="pink-bg"></td>
    </tr>

    <!-- الصف 2 -->
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td class="dark-red-bg"></td>
      <td></td>
      <td class="pink-bg"></td>
    </tr>

    <!-- الصف 3 -->
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td class="dark-red-bg"></td>
      <td></td>
      <td></td>
      <td class="pink-bg"></td>
    </tr>

    <!-- الصف 4 -->
    <tr>
      <td></td>
      <td></td>
      <td class="dark-red-bg"></td>
      <td></td>
      <td></td>
      <td></td>
      <td class="pink-bg"></td>
    </tr>

    <!-- الصف 5 -->
    <tr>
      <td></td>
      <td class="dark-red-bg"></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td class="pink-bg"></td>
    </tr>

    <!-- الصف 6 -->
    <tr>
      <td class="dark-red-bg"></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td class="pink-bg"></td>
    </tr>
  </table>

</body>
</html>
