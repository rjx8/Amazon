<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة قص ملفات PDF</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="file"], input[type="number"], button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
        }
        .range-container {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #27ae60; }
        #status { margin-top: 15px; color: #7f8c8d; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>قص صفحات PDF</h2>
    
    <input type="file" id="pdf-file" accept=".pdf">
    
    <div class="range-container">
        <input type="number" id="start-page" placeholder="من صفحة" min="1">
        <input type="number" id="end-page" placeholder="إلى صفحة" min="1">
    </div>
    
    <button onclick="splitPdf()">قص وتحميل الملف</button>
    
    <div id="status"></div>
</div>

<script>
    async function splitPdf() {
        const fileInput = document.getElementById('pdf-file');
        const startPageInput = document.getElementById('start-page');
        const endPageInput = document.getElementById('end-page');
        const status = document.getElementById('status');

        // التحقق من المدخلات
        if (fileInput.files.length === 0) {
            status.innerText = "الرجاء اختيار ملف PDF أولاً.";
            return;
        }
        if (!startPageInput.value || !endPageInput.value) {
            status.innerText = "الرجاء تحديد نطاق الصفحات.";
            return;
        }

        const startPage = parseInt(startPageInput.value);
        const endPage = parseInt(endPageInput.value);

        if (startPage > endPage) {
            status.innerText = "عذراً، صفحة البداية يجب أن تكون أقل من أو تساوي صفحة النهاية.";
            return;
        }

        status.innerText = "جاري معالجة الملف...";

        try {
            // قراءة الملف المرفوع
            const file = fileInput.files[0];
            const fileArrayBuffer = await file.arrayBuffer();

            // تحميل ملف PDF الأساسي عبر المكتبة
            const srcPdfDoc = await PDFLib.PDFDocument.load(fileArrayBuffer);
            const totalPages = srcPdfDoc.getPageCount();

            // التحقق من صحة أرقام الصفحات بالنسبة للملف
            if (startPage > totalPages || endPage > totalPages || startPage < 1) {
                status.innerText = `خطأ: الملف يحتوي على ${totalPages} صفحة فقط.`;
                return;
            }

            // إنشاء ملف PDF جديد فارغ
            const pdfDoc = await PDFLib.PDFDocument.create();

            // تحديد مصفوفة الصفحات المراد نسخها (المكتبة تبدأ العد من الصفر 0)
            const pagesToCopy = [];
            for (let i = startPage - 1; i < endPage; i++) {
                pagesToCopy.push(i);
            }

            // نسخ الصفحات المحسوبة إلى الملف الجديد
            const copiedPages = await pdfDoc.copyPages(srcPdfDoc, pagesToCopy);
            copiedPages.forEach((page) => pdfDoc.addPage(page));

            // حفظ الملف الجديد وتحميله
            const pdfBytes = await pdfDoc.save();
            
            // عملية التحميل التلقائي في المتصفح
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `قص_${startPage}_إلى_${endPage}_${file.name}`;
            link.click();

            status.innerText = "تم القص والتحميل بنجاح! 🎉";

        } catch (error) {
            console.error(error);
            status.innerText = "حدث خطأ أثناء معالجة الملف.";
        }
    }
</script>

</body>
</html>
