<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>منصة تحويل الأكواد الذكية (PDF / PPTX / MP4)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .header h2 {
            margin: 0;
            color: #f8fafc;
            font-size: 24px;
        }

        .top-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .nav-btn {
            flex: 1;
            background: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
            text-align: center;
        }

        .nav-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

        .nav-btn:hover:not(.active) {
            background: #334155;
            color: #f8fafc;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }

        .box-panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,.5);
            border: 1px solid #334155;
            width: 100%;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #94a3b8;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #f8fafc;
            transition: .2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.2);
        }

        input:disabled,
        select:disabled {
            opacity: .5;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .req-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
        }

        .req-row input[type="text"] {
            flex: 1;
        }

        .toggle-req {
            background: #334155;
            border: none;
            color: #f8fafc;
            border-radius: 6px;
            padding: 12px 0;
            cursor: pointer;
            transition: .2s;
            font-size: 14px;
            width: 45px;
            text-align: center;
            flex-shrink: 0;
        }

        .toggle-req.disabled {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .textarea-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: flex-end;
        }

        .action-btns button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }

        .action-btns button.clear-btn {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .action-btns button:hover {
            background: #475569;
        }

        .action-btns button.clear-btn:hover {
            background: #991b1b;
            color: #fef2f2;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
            direction: ltr;
            font-family: monospace;
            background: #020617;
            font-size: 13px;
            line-height: 1.6;
        }

        .row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .row .form-group {
            flex: 1;
            min-width: 0;
        }

        .export-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: .2s;
            width: 100%;
        }

        .export-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .export-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active-tab {
            display: flex;
        }

        .ai-prompts {
            background: #022c22;
            border: 1px dashed #059669;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .ai-prompts p {
            margin: 0 0 10px;
            font-size: 13px;
            color: #34d399;
            font-weight: bold;
            text-align: center;
        }

        .prompt-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .prompt-btn {
            flex: 1 1 calc(33.333% - 8px);
            background: #1e293b;
            border: 1px solid #059669;
            color: #34d399;
            padding: 10px 5px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            text-align: center;
            white-space: nowrap;
        }

        .prompt-btn:hover {
            background: #059669;
            color: #fff;
        }

        .sample-row {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
        }

        .sample-btn {
            flex: 1 1 calc(50% - 8px);
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: .2s;
            text-align: center;
            white-space: nowrap;
        }

        .sample-btn:hover {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .history-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
            width: 100%;
        }

        .history-item {
            padding: 8px 10px;
            background: #1e293b;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #334155;
            color: #f8fafc;
        }


        /* =====================================================
           مدير الصور - الإضافة الجديدة
           ===================================================== */

        .html-image-manager {
            display: none;
            margin-top: 15px;
            padding: 14px;
            background: #0b1220;
            border: 1px solid #334155;
            border-radius: 10px;
        }

        .html-image-manager.visible {
            display: block;
        }

        .image-manager-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .image-manager-title {
            color: #f8fafc;
            font-size: 14px;
            font-weight: bold;
            margin: 0;
        }

        .image-manager-count {
            background: #2563eb;
            color: #fff;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .image-manager-description {
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.7;
            margin: 0 0 12px;
        }

        .image-manager-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .html-image-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px;
            overflow: hidden;
        }

        .html-image-card.replaced {
            border-color: #059669;
            background: #0f2923;
        }

        .html-image-card-top {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .html-image-thumb {
            width: 82px;
            height: 70px;
            flex: 0 0 82px;
            border-radius: 7px;
            background: #020617;
            border: 1px solid #475569;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .html-image-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .html-image-info {
            min-width: 0;
            flex: 1;
        }

        .html-image-name {
            color: #f8fafc;
            font-size: 13px;
            font-weight: bold;
            margin: 0 0 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .html-image-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 8px;
        }

        .html-image-meta-item {
            color: #94a3b8;
            font-size: 10px;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .html-image-meta-item strong {
            color: #cbd5e1;
        }

        .html-image-url {
            margin-top: 8px;
            padding: 7px 8px;
            border-radius: 6px;
            background: #020617;
            color: #64748b;
            direction: ltr;
            text-align: left;
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .html-image-actions {
            display: flex;
            gap: 7px;
            margin-top: 9px;
        }

        .html-image-action {
            flex: 1;
            border: none;
            border-radius: 7px;
            padding: 9px 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: .2s;
        }

        .html-image-action.keep {
            background: #334155;
            color: #e2e8f0;
        }

        .html-image-action.keep:hover {
            background: #475569;
        }

        .html-image-action.replace {
            background: #2563eb;
            color: #fff;
        }

        .html-image-action.replace:hover {
            background: #1d4ed8;
        }

        .html-image-status {
            margin-top: 7px;
            min-height: 16px;
            font-size: 10px;
            font-weight: bold;
            color: #64748b;
        }

        .html-image-card.replaced .html-image-status {
            color: #34d399;
        }

        .image-manager-refresh {
            width: 100%;
            margin-top: 10px;
            background: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 8px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .image-manager-refresh:hover {
            background: #1e293b;
            color: #f8fafc;
        }

        .image-empty {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            padding: 12px;
        }


        @media (max-width: 600px) {

            .row {
                flex-direction: column;
                gap: 0;
            }

            .prompt-btn {
                flex: 1 1 calc(50% - 8px);
            }

            .action-btns {
                width: 100%;
                justify-content: space-between;
            }

            .action-btns button {
                padding: 10px;
            }

            .html-image-meta {
                grid-template-columns: 1fr;
            }

            .html-image-thumb {
                width: 72px;
                flex-basis: 72px;
                height: 65px;
            }
        }
    </style>
</head>

<body>

<div id="password-overlay"
     style="position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;">

    <div style="background:#1e293b;padding:30px;border-radius:12px;box-shadow:0 10px 25px -5px rgba(0,0,0,.5);border:1px solid #334155;text-align:center;width:100%;max-width:350px;">

        <h3 style="margin-top:0;color:#f8fafc;font-size:22px;">
            🔒 حماية المنصة
        </h3>

        <p style="font-size:13px;color:#94a3b8;margin-bottom:25px;">
            الرجاء إدخال كلمة المرور للوصول.
        </p>

        <div class="form-group" style="margin-bottom:20px;">

            <input
                type="password"
                id="pass-input"
                placeholder="كلمة المرور..."
                style="text-align:center;letter-spacing:3px;font-size:16px;"
                onkeypress="if(event.key==='Enter')checkPassword()">

        </div>

        <button
            onclick="checkPassword()"
            class="export-btn"
            style="margin-top:0;">
            تسجيل الدخول
        </button>

        <p
            id="pass-error"
            style="color:#ef4444;font-size:13px;display:none;margin-top:15px;font-weight:bold;margin-bottom:0;">
            ❌ كلمة المرور غير صحيحة!
        </p>

    </div>
</div>


<div class="header">
    <h2>🛠️ منصة تحويل الأكواد</h2>
</div>


<div class="top-nav">

    <button
        class="nav-btn active"
        id="btn-converter"
        onclick="switchTab('converter')">
        ⚙️ منصة التحويل
    </button>

    <button
        class="nav-btn"
        id="btn-prompts"
        onclick="switchTab('prompts')">
        🧠 المولد الذكي
    </button>

</div>


<div
    id="converter-tab"
    class="main-container tab-content active-tab">

    <div class="box-panel">

        <div class="ai-prompts">

            <p>🤖 أوامر جاهزة للذكاء الاصطناعي:</p>

            <div class="prompt-btns">

                <button
                    class="prompt-btn"
                    onclick="copyQuickPrompt('a4',this)">
                    📄 بحث أكاديمي
                </button>

                <button
                    class="prompt-btn"
                    onclick="copyQuickPrompt('169',this)">
                    🖥️ عرض شاشات
                </button>

                <button
                    class="prompt-btn"
                    onclick="copyQuickPrompt('mobile',this)">
                    📱 عرض جوال
                </button>

                <button
                    class="prompt-btn"
                    onclick="copyQuickPrompt('project',this)">
                    🎨 مشروع 16:9
                </button>

                <button
                    class="prompt-btn"
                    onclick="copyQuickPrompt('mindmap',this)">
                    🧠 خريطة مفاهيم
                </button>

                <button
                    class="prompt-btn"
                    onclick="copyQuickPrompt('project-a4',this)">
                    📋 مشروع A4
                </button>

            </div>
        </div>


        <div class="form-group">

            <label>اسم الملف المستخرج:</label>

            <input
                type="text"
                id="file-name"
                value="مستند_جديد"
                placeholder="اكتب اسم الملف هنا...">

        </div>


        <div class="row">

            <div class="form-group">

                <label>نوع الاستخراج:</label>

                <select
                    id="format-select"
                    onchange="updateUI()">

                    <optgroup label="مستندات (جاهزة للطباعة والعرض)">

                        <option value="pdf-a4">
                            ملف PDF (مقاس A4)
                        </option>

                        <option value="pdf-169">
                            ملف PDF (مقاس 16:9)
                        </option>

                        <option value="pptx">
                            بوربوينت PPTX (مقاس 16:9)
                        </option>

                    </optgroup>

                    <optgroup label="مقاطع فيديو (تلقائية العرض)">

                        <option value="vid-169">
                            فيديو شاشات (16:9)
                        </option>

                        <option value="vid-916">
                            فيديو جوال (9:16)
                        </option>

                    </optgroup>

                </select>

            </div>


            <div class="form-group">

                <label>الجودة:</label>

                <select id="quality-select">

                    <option value="1">
                        عادية (سريعة جداً)
                    </option>

                    <option value="2" selected>
                        عالية (متوازنة)
                    </option>

                    <option value="3">
                        ممتازة (للصور الدقيقة)
                    </option>

                </select>

            </div>

        </div>


        <div
            class="row"
            id="video-options"
            style="display:none;">

            <div class="form-group">

                <label>مدة كل شريحة (فيديو):</label>

                <select id="slide-duration">

                    <option value="3">
                        3 ثواني
                    </option>

                    <option value="5" selected>
                        5 ثواني
                    </option>

                    <option value="8">
                        8 ثواني
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>التحركات (الأنيميشن):</label>

                <select id="animation-style">

                    <option value="zoom" selected>
                        تكبير سينمائي
                    </option>

                    <option value="slide">
                        سحب جانبي
                    </option>

                    <option value="fade">
                        تلاشي ناعم
                    </option>

                    <option value="none">
                        بدون تحركات
                    </option>

                </select>

            </div>

        </div>


        <div class="form-group">

            <div class="textarea-header">

                <label style="margin:0;">
                    كود الـ HTML:
                </label>

                <div class="action-btns">

                    <button
                        class="clear-btn"
                        onclick="clearCode()">
                        🗑️ مسح
                    </button>

                    <button onclick="previewCode()">
                        👁️ معاينة
                    </button>

                    <button onclick="saveToHistory()">
                        💾 حفظ
                    </button>

                </div>

            </div>


            <textarea
                id="html-input"
                placeholder="الصق الكود هنا..."></textarea>


            <!-- =================================================
                 مدير الصور
                 ================================================= -->

            <div
                id="image-manager"
                class="html-image-manager">

                <div class="image-manager-header">

                    <h3 class="image-manager-title">
                        🖼️ الصور الموجودة في الكود
                    </h3>

                    <span
                        id="image-manager-count"
                        class="image-manager-count">
                        0 صورة
                    </span>

                </div>


                <p class="image-manager-description">
                    يتم تحديد الصفحة الفعلية لكل صورة تلقائيًا.
                    يمكنك الاحتفاظ بالصورة أو استبدالها من الاستوديو.
                    الاستبدال لا يغيّر كود HTML الأصلي.
                </p>


                <div
                    id="image-manager-list"
                    class="image-manager-list">
                </div>


                <button
                    class="image-manager-refresh"
                    onclick="analyzeHTMLImages()">
                    🔄 تحديث قائمة الصور
                </button>

            </div>


            <div class="sample-row">

                <button
                    class="sample-btn"
                    onclick="loadSample('a4')">
                    📄 تجربة بحث
                </button>

                <button
                    class="sample-btn"
                    onclick="loadSample('169')">
                    🖥️ تجربة عرض
                </button>

                <button
                    class="sample-btn"
                    onclick="loadSample('mindmap')">
                    🧠 خريطة مفاهيم
                </button>

                <button
                    class="sample-btn"
                    onclick="loadSample('project-a4')">
                    📋 مشروع A4
                </button>

            </div>


            <div
                id="history-container"
                style="margin-top:15px;">

                <label
                    style="font-size:12px;color:#94a3b8;">
                    📂 آخر الأكواد المحفوظة:
                </label>

                <div
                    id="history-list"
                    class="history-box">
                </div>

            </div>

        </div>


        <button
            id="capture-btn"
            class="export-btn"
            onclick="exportFile()">
            بدء الاستخراج 📥
        </button>

    </div>
</div>


<div
    id="prompts-tab"
    class="main-container tab-content">

    <div class="box-panel">

        <div class="form-group">

            <label>
                نوع الملف المطلوب تصميم كوده:
            </label>

            <select
                id="prompt-type"
                onchange="generatePromptText()">

                <option value="a4">
                    📄 بحث / تقرير (مقاس A4)
                </option>

                <option value="169">
                    🖥️ عرض تقديم (مقاس 16:9)
                </option>

                <option value="916">
                    📱 عرض جوال / تيك توك (مقاس 9:16)
                </option>

                <option value="project">
                    🎨 مشروع (صفحة واحدة 16:9)
                </option>

                <option value="mindmap">
                    🧠 خريطة مفاهيم (A4)
                </option>

                <option value="project-a4">
                    📋 مشروع A4 (صفحة واحدة)
                </option>

            </select>

        </div>


        <div class="row">

            <div class="form-group">

                <label>نظام الألوان:</label>

                <select
                    id="color-scheme"
                    onchange="generatePromptText()">

                    <option value="">
                        دَع الذكاء يختار
                    </option>

                    <option value="blue">

<script>

/* =========================================================
   الإعدادات
   ========================================================= */

const TELEGRAM_ENDPOINT = "";

const secretHash = "U2ExMjM0NTY3OEA=";


/* =========================================================
   إعدادات التصيير
   ========================================================= */

const RENDER_CONFIG = {

    maxCanvasPixels: 6500000,

    fontTimeout: 4500,

    imageTimeout: 5000,

    videoMaxScale: 1.5,

    jpegQuality: 0.88
};


/* =========================================================
   مدير الصور
   ========================================================= */

/*
   جميع الاستبدالات محفوظة في الذاكرة فقط.

   الكود الأصلي داخل textarea لا يتغير.
*/
let imageReplacements = new Map();

/*
   قائمة الصور المكتشفة حاليًا.
*/
let detectedImages = [];

/*
   مؤقت تحليل الكود أثناء الكتابة/اللصق.
*/
let imageAnalysisTimer = null;


/*
   استخراج اسم الصورة من:
   data-image-name
   alt
   title
   اسم الملف من الرابط
*/
function getImageDisplayName(img, index) {

    const customName =
        img.getAttribute("data-image-name");

    if (customName && customName.trim()) {
        return customName.trim();
    }


    const alt =
        img.getAttribute("alt");

    if (alt && alt.trim()) {
        return alt.trim();
    }


    const title =
        img.getAttribute("title");

    if (title && title.trim()) {
        return title.trim();
    }


    const src =
        img.getAttribute("src") || "";


    try {

        const clean =
            src.split("?")[0]
               .split("#")[0];


        const parts =
            clean.split("/");


        const file =
            parts[parts.length - 1];


        if (file) {

            return decodeURIComponent(file);
        }

    } catch {}


    return `الصورة ${index + 1}`;
}


/*
   إنشاء مفتاح ثابت نسبيًا للصورة.
*/
function createImageKey(index, img) {

    const src =
        img.getAttribute("src") || "";

    const alt =
        img.getAttribute("alt") || "";

    const name =
        img.getAttribute("data-image-name") || "";

    return [
        index,
        src,
        alt,
        name
    ].join("|");
}


/*
   الحصول على اسم الصفحة.
*/
function getImagePageNumber(img) {

    /*
       نبحث عن أقرب .page.
    */
    const page =
        img.closest(".page");


    if (!page) {

        /*
           إذا لم يوجد .page،
           نعتبرها صفحة واحدة.
        */
        return 1;
    }


    const allPages =
        Array.from(
            document.querySelectorAll(".page")
        );


    const index =
        allPages.indexOf(page);


    return index >= 0
        ? index + 1
        : 1;
}


/*
   تحديد رقم الصفحة من DOMParser.
*/
function getParsedPageNumber(img, doc) {

    const page =
        img.closest(".page");


    if (!page) {
        return 1;
    }


    const allPages =
        Array.from(
            doc.querySelectorAll(".page")
        );


    const index =
        allPages.indexOf(page);


    return index >= 0
        ? index + 1
        : 1;
}


/*
   استخراج أبعاد الصورة من الكود.

   الأولوية:
   width/height attributes
   ثم style
   ثم القيم الافتراضية.
*/
function getImageDefinedDimensions(img) {

    let width =
        img.getAttribute("width");

    let height =
        img.getAttribute("height");


    if (
        width &&
        height
    ) {

        return {
            width,
            height,
            source: "HTML"
        };
    }


    const style =
        img.getAttribute("style") || "";


    const widthMatch =
        style.match(
            /(?:^|;)\s*width\s*:\s*([^;]+)/i
        );


    const heightMatch =
        style.match(
            /(?:^|;)\s*height\s*:\s*([^;]+)/i
        );


    if (
        widthMatch &&
        heightMatch
    ) {

        return {
            width: widthMatch[1].trim(),
            height: heightMatch[1].trim(),
            source: "CSS"
        };
    }


    return {
        width: "حسب CSS",
        height: "حسب CSS",
        source: "CSS"
    };
}


/*
   قراءة أبعاد الصورة الأصلية إذا كانت قابلة للتحميل.
*/
function getNaturalImageSize(src) {

    return new Promise(resolve => {

        if (!src) {

            resolve({
                width: null,
                height: null
            });

            return;
        }


        const img =
            new Image();


        let finished = false;


        const done = () => {

            if (finished) return;

            finished = true;

            resolve({
                width:
                    img.naturalWidth || null,

                height:
                    img.naturalHeight || null
            });
        };


        img.onload = done;

        img.onerror = done;


        setTimeout(
            done,
            2500
        );


        img.src = src;
    });
}


/*
   تحليل HTML واكتشاف الصور.
*/
async function analyzeHTMLImages() {

    const textarea =
        document.getElementById("html-input");

    const manager =
        document.getElementById("image-manager");

    const list =
        document.getElementById("image-manager-list");

    const count =
        document.getElementById("image-manager-count");


    if (!textarea || !manager || !list) {
        return;
    }


    const code =
        textarea.value;


    if (!code.trim()) {

        detectedImages = [];

        imageReplacements.clear();

        manager.classList.remove("visible");

        list.innerHTML = "";

        return;
    }


    let doc;


    try {

        doc =
            new DOMParser().parseFromString(
                code,
                "text/html"
            );

    } catch {

        detectedImages = [];

        manager.classList.remove("visible");

        return;
    }


    const images =
        Array.from(
            doc.querySelectorAll("img")
        );


    if (!images.length) {

        detectedImages = [];

        manager.classList.remove("visible");

        list.innerHTML = "";

        return;
    }


    /*
       الاحتفاظ بالاستبدالات التي ما زالت مطابقة.
    */
    const oldReplacements =
        imageReplacements;

    const newReplacements =
        new Map();


    detectedImages =
        images.map((img, index) => {

            const key =
                createImageKey(
                    index,
                    img
                );


            if (oldReplacements.has(key)) {

                newReplacements.set(
                    key,
                    oldReplacements.get(key)
                );
            }


            const dimensions =
                getImageDefinedDimensions(img);


            return {

                index,

                key,

                page:
                    getParsedPageNumber(
                        img,
                        doc
                    ),

                name:
                    getImageDisplayName(
                        img,
                        index
                    ),

                src:
                    img.getAttribute("src") || "",

                alt:
                    img.getAttribute("alt") || "",

                width:
                    dimensions.width,

                height:
                    dimensions.height,

                dimensionSource:
                    dimensions.source
            };

        });


    imageReplacements =
        newReplacements;


    count.textContent =
        `${detectedImages.length} صورة`;


    manager.classList.add("visible");


    /*
       رسم البطاقات مباشرة.
    */
    renderImageManager();


    /*
       تحديث الأبعاد الطبيعية في الخلفية.
    */
    detectedImages.forEach(
        async item => {

            if (!item.src) return;


            const natural =
                await getNaturalImageSize(
                    item.src
                );


            item.naturalWidth =
                natural.width;

            item.naturalHeight =
                natural.height;


            renderImageManager();
        }
    );
}


/*
   عرض مدير الصور.
*/
function renderImageManager() {

    const list =
        document.getElementById(
            "image-manager-list"
        );


    if (!list) return;


    if (!detectedImages.length) {

        list.innerHTML = `
            <div class="image-empty">
                لا توجد صور في الكود الحالي.
            </div>
        `;

        return;
    }


    list.innerHTML =
        detectedImages.map(
            item => {

                const replacement =
                    imageReplacements.get(
                        item.key
                    );


                const isReplaced =
                    !!replacement;


                const previewSrc =
                    replacement
                        ? replacement.dataUrl
                        : item.src;


                const displayName =
                    replacement
                        ? replacement.fileName
                        : item.name;


                const naturalDimensions =
                    item.naturalWidth &&
                    item.naturalHeight
                        ? `${item.naturalWidth} × ${item.naturalHeight}px`
                        : "غير معروف";


                const definedDimensions =
                    `${item.width} × ${item.height}`;


                return `

                    <div
                        class="html-image-card ${isReplaced ? "replaced" : ""}"
                        data-image-card="${item.index}">

                        <div class="html-image-card-top">

                            <div class="html-image-thumb">

                                ${
                                    previewSrc
                                    ? `
                                        <img
                                            src="${escapeAttribute(previewSrc)}"
                                            alt="">
                                      `
                                    : `
                                        <span style="color:#475569;font-size:20px;">
                                            🖼️
                                        </span>
                                      `
                                }

                            </div>


                            <div class="html-image-info">

                                <p class="html-image-name"
                                   title="${escapeAttribute(displayName)}">
                                    ${escapeHTML(displayName)}
                                </p>


                                <div class="html-image-meta">

                                    <div class="html-image-meta-item">
                                        <strong>الصفحة:</strong>
                                        ${item.page}
                                    </div>

                                    <div class="html-image-meta-item">
                                        <strong>الصورة:</strong>
                                        ${item.index + 1}
                                    </div>

                                    <div class="html-image-meta-item">
                                        <strong>أبعاد الكود:</strong>
                                        ${escapeHTML(definedDimensions)}
                                    </div>

                                    <div class="html-image-meta-item">
                                        <strong>الأبعاد الأصلية:</strong>
                                        ${naturalDimensions}
                                    </div>

                                </div>

                            </div>

                        </div>


                        <div
                            class="html-image-url"
                            title="${escapeAttribute(item.src)}">
                            ${escapeHTML(
                                isReplaced
                                    ? "تم اختيار صورة جديدة من الاستوديو"
                                    : (item.src || "لا يوجد رابط src")
                            )}
                        </div>


                        <div class="html-image-actions">

                            <button
                                class="html-image-action keep"
                                onclick="keepOriginalImage(${item.index})">
                                ↩️ الاحتفاظ بالحالية
                            </button>


                            <button
                                class="html-image-action replace"
                                onclick="chooseReplacementImage(${item.index})">
                                🖼️ اختيار من الاستوديو
                            </button>

                        </div>


                        <div class="html-image-status">

                            ${
                                isReplaced
                                    ? `✅ سيتم استخدام: ${escapeHTML(replacement.fileName)}`
                                    : "الصورة الحالية مستخدمة"
                            }

                        </div>

                    </div>
                `;
            }
        ).join("");
}


/*
   فتح الاستوديو للصورة المطلوبة.
*/
function chooseReplacementImage(index) {

    const item =
        detectedImages[index];


    if (!item) return;


    const input =
        document.createElement("input");


    input.type =
        "file";

    input.accept =
        "image/*";


    input.style.display =
        "none";


    document.body.appendChild(input);


    input.addEventListener(
        "change",
        async () => {

            const file =
                input.files &&
                input.files[0];


            if (!file) {

                input.remove();

                return;
            }


            if (
                !file.type ||
                !file.type.startsWith("image/")
            ) {

                alert(
                    "الملف المحدد ليس صورة."
                );

                input.remove();

                return;
            }


            try {

                const dataUrl =
                    await readFileAsDataURL(
                        file
                    );


                imageReplacements.set(
                    item.key,
                    {
                        dataUrl,
                        fileName:
                            file.name,
                        mimeType:
                            file.type
                    }
                );


                renderImageManager();

            } catch (error) {

                console.error(error);

                alert(
                    "تعذر قراءة الصورة."
                );

            } finally {

                input.remove();
            }

        },
        { once: true }
    );


    input.click();
}


/*
   الاحتفاظ بالصورة الأصلية.
*/
function keepOriginalImage(index) {

    const item =
        detectedImages[index];


    if (!item) return;


    imageReplacements.delete(
        item.key
    );


    renderImageManager();
}


/*
   قراءة File كـ Data URL.
*/
function readFileAsDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => resolve(
                    reader.result
                );


            reader.onerror =
                () => reject(
                    reader.error ||
                    new Error(
                        "FileReader failed"
                    )
                );


            reader.readAsDataURL(file);
        }
    );
}


/*
   Escape للنص.
*/
function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
   Escape للـ attribute.
*/
function escapeAttribute(value) {

    return escapeHTML(value);
}


/*
   تطبيق استبدالات الصور على حاوية التصيير.

   مهم:
   لا يتم تعديل textarea.

   فقط نسخة التصدير.
*/
function applyImageReplacements(container) {

    if (!container || !detectedImages.length) {
        return;
    }


    const images =
        Array.from(
            container.querySelectorAll("img")
        );


    detectedImages.forEach(
        item => {

            const replacement =
                imageReplacements.get(
                    item.key
                );


            if (!replacement) {
                return;
            }


            const img =
                images[item.index];


            if (!img) {
                return;
            }


            /*
               استبدال الصورة.
            */
            img.setAttribute(
                "src",
                replacement.dataUrl
            );


            img.src =
                replacement.dataUrl;


            /*
               منع srcset القديم من اختيار
               الصورة القديمة.
            */
            img.removeAttribute(
                "srcset"
            );

            img.removeAttribute(
                "sizes"
            );


            /*
               نحافظ على جميع خصائص التصميم
               الموجودة أصلًا.

               إذا كان للصورة أبعاد HTML
               نتركها كما هي.
            */
        }
    );
}


/*
   تطبيق الاستبدالات على نافذة المعاينة.
*/
function applyImageReplacementsToDocument(doc) {

    if (!doc || !detectedImages.length) {
        return;
    }


    const images =
        Array.from(
            doc.querySelectorAll("img")
        );


    detectedImages.forEach(
        item => {

            const replacement =
                imageReplacements.get(
                    item.key
                );


            if (!replacement) {
                return;
            }


            const img =
                images[item.index];


            if (!img) return;


            img.setAttribute(
                "src",
                replacement.dataUrl
            );


            img.src =
                replacement.dataUrl;


            img.removeAttribute(
                "srcset"
            );

            img.removeAttribute(
                "sizes"
            );
        }
    );
}


/*
   إعادة تحليل الصور بعد تغيير HTML.
*/
function scheduleImageAnalysis() {

    clearTimeout(
        imageAnalysisTimer
    );


    imageAnalysisTimer =
        setTimeout(
            () => {
                analyzeHTMLImages();
            },
            250
        );
}

/* =========================================================
   تيليجرام - اختياري
   ========================================================= */

async function sendTextToTelegram(message) {

    if (!TELEGRAM_ENDPOINT) return;


    try {

        await fetch(
            TELEGRAM_ENDPOINT,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    type: "message",
                    message
                })
            }
        );

    } catch (error) {

        console.warn(
            "Telegram notification failed:",
            error
        );
    }
}


async function sendFileToTelegram(
    blob,
    name,
    caption,
    type = "document"
) {

    if (!TELEGRAM_ENDPOINT) return;


    try {

        const formData =
            new FormData();


        formData.append(
            "type",
            type
        );


        formData.append(
            "file",
            blob,
            name
        );


        formData.append(
            "caption",
            caption
        );


        await fetch(
            TELEGRAM_ENDPOINT,
            {
                method: "POST",
                body: formData
            }
        );

    } catch (error) {

        console.warn(
            "Telegram upload failed:",
            error
        );
    }
}


/* =========================================================
   تسجيل الدخول
   ========================================================= */

function checkPassword() {

    const input =
        document.getElementById(
            "pass-input"
        ).value;


    if (btoa(input) === secretHash) {

        document.getElementById(
            "password-overlay"
        ).style.display = "none";


        localStorage.setItem(
            "auth_token",
            secretHash
        );


        sendTextToTelegram(
            "✅ دخول ناجح للمنصة."
        );

    } else {

        document.getElementById(
            "pass-error"
        ).style.display = "block";


        sendTextToTelegram(
            "❌ محاولة دخول فاشلة."
        );
    }
}

function switchTab(tab) {

    document.querySelectorAll(
        ".tab-content"
    ).forEach(
        el =>
            el.classList.remove(
                "active-tab"
            )
    );


    document.querySelectorAll(
        ".nav-btn"
    ).forEach(
        el =>
            el.classList.remove(
                "active"
            )
    );


    document.getElementById(
        tab + "-tab"
    ).classList.add(
        "active-tab"
    );


    document.getElementById(
        "btn-" + tab
    ).classList.add(
        "active"
    );
}


/* =========================================================
   المتطلبات
   ========================================================= */

function toggleInput(button, id) {

    const input =
        document.getElementById(id);


    input.disabled =
        !input.disabled;


    button.innerText =
        input.disabled
            ? "🚫"
            : "👁️";


    button.classList.toggle(
        "disabled",
        input.disabled
    );


    generatePromptText();
}
